# reference_topic_name: /camera/camera/color/image_raw/compressed
# reference_topic_name: /camera/camera/depth/image_rect_raw
reference_topic_name: /webcam1/image_raw/compressed

# How frames are built (postprocess/utils.py): the action of a frame is the command in effect at the NEXT frame (the
# command that followed the observation; "current": the one the observation was already following); times are the
# messages' header stamps, as ForceVAM's inference node uses them (ros2/forcevam_inference inference_thread.py: the
# latest front_cam1 stamp is "now", every other topic its last message stamped at or before it), so training frames
# are built exactly as the policy's inputs at run time ("receive": the recorder's receive times); every camera
# resized to image_size (width, height); the numeric topics also stored at full rate under raw/.
action_time: next_frame
time_source: header
image_size: [256, 256]
save_raw_streams: true

selected_topics_conversion:
  
  # OBSERVATION
  # Vision
  - hdf5_name: observations/gripper_camera
    from_rosbag_topic_name: /camera/camera/color/image_raw/compressed
  #- hdf5_name: observations/gripper_camera_depth
  #  from_rosbag_topic_name: /camera/camera/depth/image_rect_raw
  - hdf5_name: observations/front_cam1
    from_rosbag_topic_name: /webcam1/image_raw/compressed
  - hdf5_name: observations/front_cam2
    from_rosbag_topic_name: /webcam2/image_raw/compressed
  - hdf5_name: observations/front_cam3
    from_rosbag_topic_name: /webcam3/image_raw/compressed

  # Kinematic robot state
  - hdf5_name: observations/joint_pos
    from_rosbag_topic_name: /cartesian_impedance/joint_state
    physical_quantity: position
  - hdf5_name: observations/joint_vel
    from_rosbag_topic_name: /cartesian_impedance/joint_state
    physical_quantity: velocity
  - hdf5_name: observations/curr_ee_pos
    from_rosbag_topic_name: /cartesian_impedance/cartesian_pos_curr
  - hdf5_name: observations/gripper_width
    from_rosbag_topic_name: /panda_gripper/width

  # Force-feedback
  - hdf5_name: observations/ee_force
    from_rosbag_topic_name: /bota_ft_sensor/wrench_filtered
    physical_quantity: force
  - hdf5_name: observations/ee_torque
    from_rosbag_topic_name: /bota_ft_sensor/wrench_filtered
    physical_quantity: torque
  # The Bota's raw wrench (the filtered one above is low-passed for teleoperation and smooths contact events away);
  # optional: bags recorded before it was added convert without it
  - hdf5_name: observations/ee_force_raw
    from_rosbag_topic_name: /bota_ft_sensor/wrench
    physical_quantity: force
    optional: true
  - hdf5_name: observations/ee_torque_raw
    from_rosbag_topic_name: /bota_ft_sensor/wrench
    physical_quantity: torque
    optional: true
  - hdf5_name: observations/joint_torques
    from_rosbag_topic_name: /cartesian_impedance/joint_state
    physical_quantity: effort

  # ACTION
  # The commanded pose: what teleoperation sends to the controller, and what a policy sends at run time (ForceVAM's
  # policy node publishes on this topic). Not cartesian_pos_des_filt, the controller's own filtered copy of it: a
  # policy trained on filtered targets would have them filtered a second time by the controller (extra lag).
  - hdf5_name: actions/desired_ee_pos
    from_rosbag_topic_name: /cartesian_impedance/equilibrium_pose
  - hdf5_name: actions/desired_gripper_width
    from_rosbag_topic_name: /panda_gripper/gripper_command
